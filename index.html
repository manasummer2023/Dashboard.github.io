<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DramaAd Pro - 短剧投放后台</title>
<style>
:root{--bg:#f2f4f7;--card-bg:#fff;--hover-bg:#f7f8fa;--border:#e8eaed;--border-l:#d2d5d9;--text:#1f2329;--text-dim:#8b8f96;--text-muted:#b0b4bb;--accent:#1664ff;--accent-h:#0e4fd9;--green:#00a870;--gold:#f5a623;--orange:#ff7d00;--blue:#1664ff;--purple:#7b3ff2;--radius:4px;--shadow:0 1px 4px rgba(0,0,0,.06)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;font-size:13px;line-height:1.5;min-height:100vh}
a{color:inherit;text-decoration:none}img{display:block;max-width:100%}
.app-layout{display:flex;min-height:100vh}
.sidebar{width:170px;background:var(--card-bg);border-right:1px solid var(--border);position:fixed;top:0;left:0;bottom:0;z-index:100;display:flex;flex-direction:column}
.sidebar-logo{padding:14px 16px;display:flex;align-items:center;gap:10px}
.logo-icon{width:30px;height:30px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff}
.logo-text h1{font-size:14px;font-weight:600;color:var(--text)}.logo-text p{font-size:11px;color:var(--text-dim)}
.sidebar-nav{flex:1;padding:8px;overflow-y:auto}
.nav-section-title{font-size:11px;color:var(--text-muted);padding:10px 12px 4px;font-weight:500}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:6px;cursor:pointer;color:var(--text-dim);font-size:13px;margin-bottom:1px;transition:all .15s}
.nav-item:hover{background:var(--hover-bg);color:var(--text)}.nav-item.active{background:#e8f0ff;color:var(--accent);font-weight:600}
.nav-icon{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border)}
.user-card{display:flex;align-items:center;gap:8px}.user-avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff}
.user-info p:first-child{font-size:12px;font-weight:600}.user-info p:last-child{font-size:11px;color:var(--green);font-weight:600}
.main-content{margin-left:170px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{height:38px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:16px;background:var(--card-bg);position:sticky;top:0;z-index:50;box-shadow:var(--shadow)}
.topbar-title{font-size:15px;font-weight:600}
.lang-toggle{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.lang-btn{padding:4px 12px;font-size:12px;cursor:pointer;background:none;border:none;color:var(--text-dim);font-family:inherit}
.lang-btn.active{background:var(--accent);color:#fff}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.balance-badge{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:4px 12px;font-size:12px}
.balance-amount{color:var(--green);font-weight:700}
.page-content{padding:8px 12px;flex:1;max-width:1400px}
/* Card */
.card{background:var(--card-bg);border-radius:6px;box-shadow:var(--shadow);padding:10px;margin-bottom:6px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.card-title{font-size:13px;font-weight:600}
/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat-card{background:var(--card-bg);border-radius:8px;box-shadow:var(--shadow);padding:14px}
.stat-label{font-size:12px;color:var(--text-dim);margin-bottom:6px}
.stat-value{font-size:24px;font-weight:700}
/* Tabs */
.region-tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--bg);border-radius:6px;padding:3px;width:fit-content}
.region-tab{padding:6px 16px;font-size:12px;font-weight:500;color:var(--text-dim);cursor:pointer;border-radius:4px;transition:all .15s;display:flex;align-items:center;gap:6px}
.region-tab:hover{color:var(--text)}.region-tab.active{background:var(--card-bg);color:var(--text);font-weight:600;box-shadow:var(--shadow)}
.region-dot{width:6px;height:6px;border-radius:50%}.region-dot.west{background:var(--blue)}.region-dot.arab{background:var(--green)}.region-dot.asia{background:var(--orange)}
/* Table */
.drama-table{width:100%;border-collapse:collapse}
.drama-table th{text-align:left;font-size:10px;color:var(--text-dim);font-weight:500;padding:4px 6px;border-bottom:1px solid var(--border);background:var(--hover-bg)}
.drama-table td{padding:3px 6px;border-bottom:1px solid var(--border);font-size:11px}
.drama-table tr:hover{background:var(--hover-bg)}
.drama-poster-cell{width:36px;height:48px;border-radius:4px;object-fit:cover}
.drama-title-cell{font-weight:600}.drama-genres{color:var(--text-dim);font-size:11px}
/* Badges */
.status-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:3px}
.status-badge.active{background:#e6f7ee;color:var(--green)}.status-badge.paused{background:#fff3e8;color:var(--orange)}.status-badge.blocked{background:#fde8e8;color:#e50914}.status-badge.review{background:#fffbe6;color:var(--gold)}
.region-badge{font-size:10px;font-weight:500;padding:1px 6px;border-radius:3px;margin-right:2px}
.region-badge.west{background:#e8f0ff;color:var(--blue)}.region-badge.arab{background:#e6f7ee;color:var(--green)}.region-badge.asia{background:#fff3e8;color:var(--orange)}
/* Buttons */
.btn{padding:6px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--card-bg);color:var(--text);font-size:12px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:4px;transition:all .15s}
.btn:hover{background:var(--hover-bg);border-color:var(--border-l)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent-h)}.btn.small{padding:3px 8px;font-size:11px}
.btn.danger{color:#e50914;border-color:#fde8e8;background:#fff}.btn.danger:hover{background:#fde8e8}
/* Modal */
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:var(--card-bg);border-radius:8px;width:90%;max-width:520px;max-height:85vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.12)}
.modal-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:15px;font-weight:600}.modal-close{background:none;border:none;color:var(--text-dim);font-size:20px;cursor:pointer}
.modal-body{padding:20px}.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
/* TikTok modal */
.tiktok-modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.4);display:flex;align-items:flex-start;justify-content:center;padding-top:40px}
.tiktok-modal{background:var(--card-bg);border-radius:8px;max-height:85vh;overflow-y:auto;padding:20px;min-width:640px;max-width:820px;width:90vw;box-shadow:0 8px 32px rgba(0,0,0,.12)}
.tiktok-modal .modal-header{border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.tiktok-modal .modal-title{font-size:15px;font-weight:600}
.tiktok-modal .modal-close{background:none;border:none;color:var(--text-dim);font-size:20px;cursor:pointer}
.tiktok-modal .modal-close:hover{color:var(--text)}
/* Time range */
.time-range-btn{background:transparent;border:none;color:var(--text-dim);padding:3px 10px;border-radius:4px;font-size:12px;cursor:pointer;transition:all .15s}
.time-range-btn:hover{color:var(--text)}.time-range-btn.active{background:var(--accent);color:#fff;font-weight:500}
/* Forms */
.form-group{margin-bottom:12px}.form-label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:4px}
.form-input,.form-select,.form-textarea{width:100%;background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:6px 10px;color:var(--text);font-size:13px;font-family:inherit}
.form-input:focus,.form-select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(22,100,255,.1)}
.form-textarea{resize:vertical;min-height:60px}
.form-row{display:flex;gap:10px}.form-row .form-group{flex:1}
/* Toast */
.toast{position:fixed;bottom:20px;right:20px;z-index:300;background:var(--card-bg);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.15);padding:10px 16px;font-size:12px;transform:translateY(100px);opacity:0;transition:all .2s}
.toast.show{transform:translateY(0);opacity:1}
/* Dashboard */
.dashboard-hero{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px}
.region-card{background:var(--card-bg);border-radius:8px;box-shadow:var(--shadow);padding:14px;cursor:pointer;transition:all .15s;border-top:3px solid transparent}
.region-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.1)}.region-card.west{border-top-color:var(--blue)}.region-card.arab{border-top-color:var(--green)}.region-card.asia{border-top-color:var(--orange)}
.region-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.region-card-name{font-size:14px;font-weight:600}
.region-card-performance{font-size:10px;padding:2px 8px;border-radius:3px;font-weight:600}
.region-card-performance.good{background:#e6f7ee;color:var(--green)}.region-card-performance.mid{background:#fffbe6;color:var(--gold)}.region-card-performance.poor{background:#fde8e8;color:#e50914}
.region-metric{display:flex;justify-content:space-between;padding:4px 0;font-size:12px}
.region-metric-label{color:var(--text-dim)}.region-metric-value{font-weight:600}
.platform-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.platform-tag{font-size:10px;padding:2px 6px;border-radius:3px;background:var(--hover-bg);color:var(--text-dim)}
/* Timezone */
.timezone-row{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:12px}
.timezone-clock{background:var(--card-bg);border-radius:6px;box-shadow:var(--shadow);padding:10px 8px;text-align:center}
.timezone-city{font-size:11px;color:var(--text-dim);margin-bottom:4px}
.timezone-time{font-size:18px;font-weight:700;font-family:'SF Mono','Monaco',monospace}
.timezone-date{font-size:10px;color:var(--text-muted);margin-top:2px}
/* Bar chart */
.bar-chart-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bar-chart-label{width:80px;font-size:11px;color:var(--text-dim);flex-shrink:0}
.bar-chart-track{flex:1;height:18px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar-chart-fill{height:100%;border-radius:4px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:10px;font-weight:600;color:#fff}
/* Misc */
.upload-zone{border:2px dashed var(--border);border-radius:6px;padding:30px;text-align:center;cursor:pointer;transition:all .15s;margin-bottom:12px}
.upload-zone:hover{border-color:var(--accent);background:var(--hover-bg)}
.upload-zone-icon{font-size:32px;margin-bottom:6px}.upload-zone-text{font-size:13px;color:var(--text-dim)}
.campaign-cover{width:48px;height:64px;object-fit:cover;border-radius:4px;border:1px solid var(--border)}
.campaign-group-row{background:var(--hover-bg)}
.campaign-group-row td{font-weight:600}
.episode-row td{padding:4px 10px!important;font-size:11px}
.ad-copy-cell{max-width:160px;font-size:11px;line-height:1.4}
.editable-num{cursor:pointer;border-bottom:1px dashed var(--text-dim);padding:1px 2px}
.editable-num:hover{background:var(--hover-bg);border-bottom-color:var(--accent)}
.origin-badge{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:500;margin-left:4px}
.origin-badge.cn{background:#fde8e8;color:#e50914}.origin-badge.us{background:#e8f0ff;color:var(--blue)}
.origin-badge.ae{background:#e6f7ee;color:var(--green)}.origin-badge.th{background:#fff3e8;color:var(--orange)}
.origin-badge.jp{background:#fffbe6;color:var(--gold)}.origin-badge.in{background:#f0e8ff;color:var(--purple)}
.rating-badge{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600}
.rating-s{background:#fffbe6;color:var(--gold)}.rating-a{background:#e6f7ee;color:var(--green)}.rating-b{background:#e8f0ff;color:var(--blue)}
.account-dot{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:12px}
.account-dot::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.empty-state{text-align:center;padding:40px;color:var(--text-dim)}
.type-badge{font-size:9px;font-weight:600;padding:1px 5px;border-radius:3px}
.type-badge.type-real{background:#e8f0ff;color:var(--blue)}.type-badge.type-ai{background:#f0e8ff;color:var(--purple)}
.upload-status-badge{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:600}
.upload-status-badge.approved{background:#e6f7ee;color:var(--green)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.toggle-switch{position:relative;width:36px;height:20px;background:var(--border);border-radius:10px;cursor:pointer;transition:background .2s}
.toggle-switch.on{background:var(--green)}
.toggle-switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle-switch.on::after{transform:translateX(16px)}
.insight-card{background:var(--card-bg);border-radius:8px;box-shadow:var(--shadow);padding:12px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.insight-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.1)}
.insight-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.insight-title{font-size:13px;font-weight:600;margin-bottom:4px}
.insight-desc{font-size:11px;color:var(--text-dim);line-height:1.5}
.copy-output{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:12px;font-size:12px;line-height:1.6;margin-top:8px}
.account-header{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.account-avatar{width:52px;height:52px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff}
.account-name{font-size:18px;font-weight:700}.account-verified{font-size:11px;color:var(--green)}
.account-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.checkbox-group{display:flex;flex-direction:column;gap:6px;max-height:160px;overflow-y:auto}
.checkbox-item{display:flex;align-items:center;gap:6px;font-size:12px}
@media(max-width:1024px){.dashboard-hero{grid-template-columns:1fr}.account-stats{grid-template-columns:repeat(2,1fr)}.timezone-row{grid-template-columns:repeat(4,1fr)}}
@media(max-width:768px){.sidebar{display:none}.main-content{margin-left:0}.timezone-row{grid-template-columns:repeat(3,1fr)}}
/* Resizable columns */
.drama-table th{position:relative;overflow:visible}
.drama-table th .resize-handle{position:absolute;right:0;top:0;bottom:0;width:5px;cursor:col-resize;z-index:10;background:transparent}
.drama-table th .resize-handle:hover,.drama-table th .resize-handle.active{background:var(--accent);opacity:.3}
.resizing{user-select:none;cursor:col-resize}
.resizing *{cursor:col-resize!important}
/* Excel-style pivot */
.excel-ribbon{display:flex;align-items:center;gap:2px;background:#f3f3f3;border:1px solid #d0d0d0;border-bottom:none;border-radius:4px 4px 0 0;padding:2px 4px}
.excel-ribbon-tab{padding:4px 12px;font-size:11px;color:#333;cursor:default;border-bottom:2px solid transparent}
.excel-ribbon-tab.active{background:#fff;border-bottom:2px solid #1a73e8;font-weight:600}
.excel-sheet{border:1px solid #d0d0d0;border-radius:0 0 4px 4px;overflow:auto;background:#fff}
.excel-table{border-collapse:collapse;width:100%;font-family:'SF Mono','Monaco','Consolas',monospace;font-size:11px}
.excel-table th{background:#1a1a2e;color:#fff;font-weight:600;padding:5px 8px;border:1px solid #d0d0d0;text-align:right;white-space:nowrap;position:sticky;top:0;z-index:5}
.excel-table th:first-child{text-align:left}
.excel-table td{border:1px solid #d0d0d0;padding:4px 8px;text-align:right;white-space:nowrap}
.excel-table td:first-child{text-align:left;font-weight:600}
.excel-table tbody tr:nth-child(even){background:#f8f9fa}
.excel-table tbody tr:hover td{background:#e3f2fd}
.excel-table .excel-rowhead{background:#f0f0f0;color:#666;font-weight:500;text-align:center;width:28px;min-width:28px;border:1px solid #d0d0d0}
.excel-table .excel-total td{background:#eef1f5;font-weight:700;border-top:2px solid #999}
.excel-chart-wrap{display:flex;gap:16px;align-items:flex-end;margin-top:8px}
.excel-chart{flex:1;display:flex;align-items:flex-end;gap:10px;padding:8px;background:#fff;border:1px solid #d0d0d0;border-radius:4px;min-height:180px}
.excel-chart-group{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.excel-chart-group-label{font-size:10px;color:var(--text-dim);margin-bottom:4px;font-weight:600}
.excel-bars{display:flex;align-items:flex-end;gap:4px;height:140px}
.excel-bar{width:28px;border-radius:2px 2px 0 0;position:relative;transition:height .2s}
.excel-bar-label{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--text-dim);white-space:nowrap}
.excel-legend{display:flex;flex-direction:column;gap:6px;justify-content:center;padding:8px}
.excel-legend-item{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--text-dim)}
.excel-legend-dot{width:10px;height:10px;border-radius:2px}
</style>
</head>
<body>
<div class="app-layout">
<aside class="sidebar">
<div class="sidebar-logo"><div class="logo-icon">D</div><div class="logo-text"><h1>DramaAd Pro</h1><p>短剧投放后台</p></div></div>
<nav class="sidebar-nav" id="sidebarNav"></nav>
<div class="sidebar-footer"><div class="user-card"><div class="user-avatar">M</div><div class="user-info"><p>MANA</p><p>$310,993.30</p></div></div></div>
</aside>
<div class="main-content">
<div class="topbar">
<div class="topbar-title" id="topbarTitle"></div>
<div class="lang-toggle"><button class="lang-btn active" onclick="setLang('zh')">中</button><button class="lang-btn" onclick="setLang('en')">EN</button></div>
<div class="topbar-right">
  <a href="yuewen-billing.html" class="btn small" style="background:var(--accent);color:#fff;border-color:var(--accent);">📊 数据总汇</a>
  <div class="balance-badge"><span>余额</span><span class="balance-amount">$310,993.30</span></div>
</div>
</div>
<div class="page-content" id="pageContent"></div>
</div>
</div>
<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalBox"><div class="modal-header"><div class="modal-title" id="modalTitle"></div><button class="modal-close" onclick="closeModal()">&times;</button></div><div class="modal-body" id="modalBody"></div><div class="modal-footer" id="modalFooter"></div></div></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
